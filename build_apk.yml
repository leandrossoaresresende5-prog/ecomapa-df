```yaml
name: Compilar APK EcoMapa DF

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Preparar projeto
        run: |
          flutter pub get
          chmod +x android/gradlew || true

      - name: Corrigir sintaxe experimental do Dart
        run: |
          sed -i 's/colorScheme: \.fromSeed/colorScheme: ColorScheme.fromSeed/g' lib/main.dart
          sed -i 's/mainAxisAlignment: \.center/mainAxisAlignment: MainAxisAlignment.center/g' lib/main.dart

      - name: Verificar código
        run: |
          flutter analyze
          flutter pub get

      - name: Compilar APK Release
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: EcoMapa-DF-Instalador
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
```
