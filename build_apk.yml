name: Compilar APK EcoMapa DF

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Corrigir dot-shorthands
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arquivo = Path("lib/main.dart")
          texto = arquivo.read_text()

          texto = texto.replace(
              "colorScheme: .fromSeed",
              "colorScheme: ColorScheme.fromSeed"
          )

          texto = texto.replace(
              "mainAxisAlignment: .center",
              "mainAxisAlignment: MainAxisAlignment.center"
          )

          arquivo.write_text(texto)
          PY

      - name: Verificar código
        run: flutter analyze

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoMapa-DF-Instalador
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
